apiVersion: batch/v1
kind: Job
metadata:
  name: welkin-certification
  namespace: welkin-system
  labels:
    app.kubernetes.io/name: welkin-certification
    app.kubernetes.io/part-of: welkin
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: welkin-certification
    spec:
      restartPolicy: Never
      serviceAccountName: welkin-certification
      volumes:
        - name: archive-evidence
          emptyDir: {}
      initContainers:
        - name: archive-verify
          image: minio/mc:RELEASE.2024-08-17T19-52-30Z
          command: ["/bin/sh", "-c"]
          env:
            - name: MINIO_ENDPOINT
              value: "http://minio:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: welkin-archive-credentials
                  key: accessKeyId
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: welkin-archive-credentials
                  key: secretAccessKey
            - name: BUCKET
              value: "welkin-archive"
            - name: EVENT_ID
              value: "certification-$(date +%s)"
          args:
            - |
              set -e
              echo "--- Archive Verification (initContainer) ---"
              echo "Waiting for main container to post event..."
              # Wait for main container to signal event posted
              while [ ! -f /shared/event_posted ]; do
                sleep 1
              done
              
              # Setup mc alias with credentials
              mc alias set minio $MINIO_ENDPOINT $MINIO_ACCESS_KEY $MINIO_SECRET_KEY
              
              echo "--- Searching for parquet objects with EVENT_ID ---"
              # Find parquet objects under events/ prefix
              # The collector writes to events/<timestamp>-<uuid>.parquet
              # We need to find the object containing our EVENT_ID
              
              # List all objects in events/ prefix
              mc ls --recursive minio/welkin-archive/events/ | grep '\.parquet$' | while read -r line; do
                obj=$(echo "$line" | awk '{print $NF}')
                echo "Found parquet: $obj"
                # Download to shared volume
                mc cp "minio/welkin-archive/$obj" /shared/
              done
              
              echo "Archive verification initContainer complete"
              touch /shared/archive_verified
      containers:
        - name: certify
          image: curlimages/curl:8.5.0
          command: ["/bin/sh", "-c"]
          volumeMounts:
            - name: archive-evidence
              mountPath: /shared
          env:
            - name: ARCHIVE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: welkin-archive-credentials
                  key: accessKeyId
            - name: ARCHIVE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: welkin-archive-credentials
                  key: secretAccessKey
          args:
            - |
              set -e
              COLLECTOR="http://openmeter-collector:8080/api/v1/events"
              OPENMETER="http://openmeter-api:80/api/v1/meters/kubernetes-pod-exec-time/values"
              MINIO="http://minio:9000"
              BUCKET="welkin-archive"
              EVENT_ID="certification-$(date +%s)"
              
              echo "=== Welkin Certification ==="
              echo "event_id: $EVENT_ID"
              
              # 1. POST CloudEvent to collector (CANONICAL BOUNDARY)
              echo "--- Posting CloudEvent to collector ---"
              HTTP_CODE=$(curl -s -o /tmp/collector-response.txt -w '%{http_code}' \
                -X POST "$COLLECTOR" \
                -H "Content-Type: application/cloudevents+json" \
                -d "{
                  \"specversion\": \"1.0\",
                  \"id\": \"$EVENT_ID\",
                  \"source\": \"welkin-certification\",
                  \"type\": \"kube-pod-exec-time\",
                  \"subject\": \"$EVENT_ID\",
                  \"datacontenttype\": \"application/json\",
                  \"data\": {
                    \"duration_seconds\": 42,
                    \"pod_name\": \"welkin-certification-target\",
                    \"pod_namespace\": \"default\"
                  }
                }")
              echo "collector HTTP status: $HTTP_CODE"
              cat /tmp/collector-response.txt
              echo ""
              
              if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
                echo "FAIL: collector rejected event (HTTP $HTTP_CODE)"
                exit 1
              fi
              
              # Signal event posted
              touch /shared/event_posted
              
              # 2. Wait for processing
              echo "--- Waiting 15s for event processing ---"
              sleep 15
              
              # 3. Query OpenMeter (ECONOMIC PLANE - REQUIRED)
              echo "--- Querying OpenMeter ---"
              OM_RESPONSE=$(curl -s "$OPENMETER?windowSize=1h&subject=$EVENT_ID")
              echo "OpenMeter response: $OM_RESPONSE"
              
              OM_VALUE=$(echo "$OM_RESPONSE" | grep -o '"value":[0-9.]*' | head -1 | cut -d: -f2)
              OM_VALUE=${OM_VALUE:-0}
              echo "OpenMeter value: $OM_VALUE"
              
              OPENMETER_OK="false"
              if [ "$(echo "$OM_VALUE" | tr -d '[:space:]')" != "0" ] && [ -n "$OM_VALUE" ]; then
                OPENMETER_OK="true"
              fi
              echo "openmeter_assertion: $OPENMETER_OK"
              
              # Wait for archive verification to complete
              echo "--- Waiting for archive verification ---"
              while [ ! -f /shared/archive_verified ]; do
                sleep 1
              done
              
              # 4. Archive verification with duckdb (ECONOMIC PLANE - INFORMATIONAL)
              echo "--- Verifying Parquet content with duckdb ---"
              MINIO_OK="false"
              
              # Install duckdb if needed
              apk add --no-cache duckdb >/dev/null 2>&1 || true
              
              for f in /shared/*.parquet; do
                if [ -f "$f" ]; then
                  echo "Checking parquet: $f"
                  # Query parquet for EVENT_ID in id column
                  if duckdb -c "SELECT 1 FROM read_parquet('$f') WHERE id = '$EVENT_ID' LIMIT 1" 2>/dev/null | grep -q "1"; then
                    echo "SUCCESS: Found EVENT_ID $EVENT_ID in $f"
                    MINIO_OK="true"
                    break
                  fi
                fi
              done
              
              echo "parquet_assertion: $MINIO_OK"
              
              # 5. Summary
              echo ""
              echo "=== Certification Result ==="
              echo "event_id: $EVENT_ID"
              echo "openmeter_assertion: $OPENMETER_OK"
              echo "parquet_assertion: $MINIO_OK"
              
              # ECONOMIC PLANE MUST PASS; ARCHIVE IS INFORMATIONAL (plane independence)
              if [ "$OPENMETER_OK" = "true" ]; then
                echo "result: passed"
                exit 0
              else
                echo "result: failed"
                exit 1
              fi
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: welkin-certification
  namespace: welkin-system