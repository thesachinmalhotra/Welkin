tests:
  - name: canonicalizes kubernetes pod into cloudevent
    target_mapping: ../canonicalize.blobl
    environment: {}
    input_batch:
      - content: |
          {
            "metadata": {
              "name": "demo-pod",
              "namespace": "acme",
              "annotations": {
                "openmeter.io/subject": "tenant-acme",
                "data.openmeter.io/region": "us-east-1"
              }
            },
            "spec": {
              "containers": [
                {
                  "resources": {
                    "limits": {"memory": "4Gi", "cpu": "500m"},
                    "requests": {"memory": "2Gi", "cpu": "250m"}
                  }
                }
              ]
            }
          }
        metadata:
          schedule_time: "2026-07-27T00:00:15Z"
          schedule_interval: "15s"
    output_batches:
      - - json_contains:
            specversion: "1.0"
            type: "kube-pod-exec-time"
            source: "kubernetes-api"
            subject: "tenant-acme"
            data:
              pod_name: "demo-pod"
              pod_namespace: "acme"
              duration_seconds: 15
              region: "us-east-1"

  - name: drops non billable kubernetes pod
    target_mapping: ../canonicalize.blobl
    environment: {}
    input_batch:
      - content: |
          {
            "metadata": {
              "name": "ignored-pod",
              "namespace": "acme",
              "annotations": {
                "openmeter.io/billable": "false"
              }
            },
            "spec": {
              "containers": [
                {
                  "resources": {
                    "limits": {},
                    "requests": {}
                  }
                }
              ]
            }
          }
        metadata:
          schedule_time: "2026-07-27T00:00:15Z"
          schedule_interval: "15s"
    output_batches:
      - []
