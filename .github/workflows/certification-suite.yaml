name: certification-suite

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  catalog:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@v0.4.0

      - name: Export certification catalog
        run: ~/go/bin/cue export cert/catalog.cue -e catalog > /tmp/welkin-certification-catalog.json

      - name: Validate certification catalog
        run: python cert/scripts/validate_catalog.py --catalog /tmp/welkin-certification-catalog.json

      - name: Emit scenario matrix
        id: matrix
        run: |
          matrix=$(python cert/scripts/validate_catalog.py --catalog /tmp/welkin-certification-catalog.json --matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  certify:
    needs: catalog
    strategy:
      fail-fast: false
      matrix:
        scenario_id: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    uses: ./.github/workflows/certification-run.yaml
    with:
      scenario_id: ${{ matrix.scenario_id }}
    secrets: inherit
