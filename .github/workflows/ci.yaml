name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  COLLECTOR_IMAGE: ghcr.io/openmeterio/benthos-collector:v1.0.0-beta.232
  TIMONI_VERSION: "0.31.0"

jobs:
  validate:
    name: Validate (vet + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Timoni
        uses: stefanprodan/timoni/actions/setup@main
        with:
          version: ${{ env.TIMONI_VERSION }}
      - name: Vet bundle
        env:
          OPENMETER_TOKEN: test
          ARCHIVE_S3_BUCKET: welkin-archive
          ARCHIVE_S3_ACCESS_KEY_ID: minio
          ARCHIVE_S3_SECRET_ACCESS_KEY: minio123
        run: |
          make vet
      - name: Build bundle
        env:
          OPENMETER_TOKEN: test
          ARCHIVE_S3_BUCKET: welkin-archive
          ARCHIVE_S3_ACCESS_KEY_ID: minio
          ARCHIVE_S3_SECRET_ACCESS_KEY: minio123
        run: |
          make build > /tmp/bundle.yaml
      - name: Setup CUE
        uses: cue-lang/setup-cue@v1
      - name: Lint CUE (dev bundle group)
        run: |
          cue vet -c platform/bundles/welkin-dev.bundle.cue platform/runtime/welkin.runtime.cue spec/meters/meters.cue platform/collector/collector.cue platform/economic/openmeter.cue platform/economic/postgres.cue platform/archive/minio.cue
      - name: Lint CUE (prod bundle group)
        run: |
          cue vet -c platform/bundles/welkin-prod.bundle.cue platform/runtime/welkin.runtime.cue spec/meters/meters.cue platform/collector/collector.cue platform/economic/openmeter.cue
      - name: Lint CUE (schema)
        run: |
          cue vet -c spec/schema/cloudevent.cue
      - name: Vet prod bundle
        env:
          OPENMETER_TOKEN: test
          ARCHIVE_S3_BUCKET: welkin-archive
          ARCHIVE_S3_ACCESS_KEY_ID: minio
          ARCHIVE_S3_SECRET_ACCESS_KEY: minio123
        run: |
          make vet-prod
