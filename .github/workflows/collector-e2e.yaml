name: collector-e2e

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind create cluster

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Deploy mock OpenMeter
        run: |
          kubectl create namespace welkin-system
          kubectl create deployment mock-openmeter -n welkin-system --image=python:3.12-slim -- python3 -c "
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
            def do_POST(self):
              b = self.rfile.read(int(self.headers.get('Content-Length', 0)))
              print('EVENT:' + b.decode(), flush=True)
              self.send_response(200)
              self.end_headers()
              self.wfile.write(b'{\"ok\":true}')
            def log_message(self, *a): pass
          http.server.HTTPServer(('0.0.0.0', 8086), H).serve_forever()
          "
          kubectl rollout status deployment/mock-openmeter -n welkin-system --timeout=120s

      - name: Deploy collector
        run: |
          helm upgrade --install openmeter-collector \
            oci://ghcr.io/openmeterio/helm-charts/benthos-collector \
            --version 1.0.0-beta.232 \
            --namespace welkin-system \
            --set fullnameOverride=openmeter-collector \
            --set config.input.http.enabled=true \
            --set openmeter.url="http://mock-openmeter.welkin-system:8086" \
            --set openmeter.token="test-token"

      - name: Wait for collector
        run: |
          kubectl rollout status statefulset/openmeter-collector -n welkin-system --timeout=300s

      - name: Send test event to collector
        run: |
          kubectl port-forward svc/openmeter-collector 4195:4195 -n welkin-system &
          sleep 3
          curl -s -X POST http://localhost:4195/events \
            -H "Content-Type: application/json" \
            -d '{"specversion":"e2e","id":"e2e-001","source":"e2e-test","type":"data","data":{"cpuSeconds":1.23}}'

      - name: Verify event reached mock OpenMeter
        run: |
          sleep 2
          MOCK_POD=$(kubectl get pod -l app=mock-openmeter -n welkin-system -o jsonpath='{.items[0].metadata.name}')
          LOGS=$(kubectl logs "$MOCK_POD" -n welkin-system 2>&1)
          echo "Mock OpenMeter logs:"
          echo "$LOGS"
          if echo "$LOGS" | grep -q "e2e-001"; then
            echo "PASS: event e2e-001 reached mock OpenMeter"
          else
            echo "FAIL: event not found in mock logs"
            exit 1
          fi

      - name: Assert event data preserved
        run: |
          MOCK_POD=$(kubectl get pod -l app=mock-openmeter -n welkin-system -o jsonpath='{.items[0].metadata.name}')
          LOGS=$(kubectl logs "$MOCK_POD" -n welkin-system 2>&1)
          if echo "$LOGS" | grep -q '"cpuSeconds": 1.23'; then
            echo "PASS: data field preserved byte-for-byte"
          else
            echo "FAIL: data field corrupted or missing"
            exit 1
          fi
