name: collector-e2e

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind create cluster

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Deploy collector
        run: |
          helm upgrade --install openmeter-collector \
            oci://ghcr.io/openmeterio/helm-charts/benthos-collector \
            --version 1.0.0-beta.232 \
            --namespace welkin-system --create-namespace \
            --set fullnameOverride=openmeter-collector \
            --set config.input.http.enabled=true \
            --set openmeter.url="http://openmeter-api" \
            --set openmeter.token="cert-test-token"

      - name: Wait for collector
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=openmeter-collector -n welkin-system --timeout=120s

      - name: Send test event
        run: |
          curl -X POST http://localhost:4195/events \
            -H "Content-Type: application/json" \
            -d '{"specversion":"e2e","id":"e2e-001","source":"e2e-test","type":"data","data":{"key":"value"}}'

      - name: Verify event at OpenMeter
        run: |
          curl -s -H "Authorization: Bearer cert-test-token" \
            "http://openmeter-api/api/v1/events?filter=source=e2e-test" | jq .

      - name: Assert event identity
        run: |
          RECEIVED_ID=$(curl -s -H "Authorization: Bearer cert-test-token" \
            "http://openmeter-api/api/v1/events?filter=source=e2e-test" | jq -r '.id // empty')
          if [ "$RECEIVED_ID" != "e2e-001" ]; then
            echo "FAIL: sent=e2e-001 received=$RECEIVED_ID"
            exit 1
          fi
          echo "PASS: sent=e2e-001 received=$RECEIVED_ID"
