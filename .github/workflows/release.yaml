name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  TIMONI_VERSION: "0.31.0"
  ARTIFACT: oci://ghcr.io/${{ github.repository_owner }}/welkin

jobs:
  build-and-push:
    name: Build & Push OCI Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Timoni
        uses: stefanprodan/timoni/actions/setup@main
        with:
          version: ${{ env.TIMONI_VERSION }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Vet composition before release
        env:
          OPENMETER_TOKEN: test
          ARCHIVE_S3_BUCKET: welkin-archive
          ARCHIVE_S3_ACCESS_KEY_ID: minio
          ARCHIVE_S3_SECRET_ACCESS_KEY: minio123
        run: |
          make vet-prod

      - name: Push OCI artifact (platform/ composition source)
        id: push
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DIGEST=$(timoni artifact push "${{ env.ARTIFACT }}" \
            -f platform \
            --tag="${VERSION}" \
            --annotation="org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation="org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation="org.opencontainers.image.version=${VERSION}" \
            2>&1 | sed -n 's/.*digest=[[:space:]]*\(sha256:[a-f0-9]\{64\}\).*/\1/p' | head -1)
          [ -n "$DIGEST" ] || { echo "push failed to produce a digest"; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${{ env.ARTIFACT }}:${VERSION} digest=${DIGEST}"

  sign-artifact:
    name: Sign Artifact (Cosign)
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Setup Cosign
        uses: sigstore/cosign-installer@main

      - name: Sign artifact
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/welkin:${{ github.ref_name }} \
            --annotations "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --annotations "git-sha=${{ github.sha }}"

      - name: Verify signature (self-check)
        run: |
          cosign verify \
            ghcr.io/${{ github.repository_owner }}/welkin:${{ github.ref_name }} \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --annotation git-sha=${{ github.sha }} \
            > /dev/null && echo "signature verified"
