name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: run

env:
  COLLECTOR_IMAGE: ghcr.io/openmeterio/benthos-collector:v1.0.0-beta.232
  TIMONI_VERSION: "0.31.0"

jobs:
  build-and-push:
    name: Build & Push OCI Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Timoni
        uses: stefanprodan/timoni/actions/setup@main
        with:
          version: ${{ env.TIMONI_VERSION }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build artifact (directory source, NO build step)
        env:
          OPENMETER_TOKEN: test
          ARCHIVE_S3_BUCKET: welkin-archive
          ARCHIVE_S3_ACCESS_KEY_ID: minio
          ARCHIVE_S3_SECRET_ACCESS_KEY: minio123
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Push OCI artifact with --resolve-symlinks
        run: |
          DIGEST=$(flux push artifact oci://ghcr.io/${{ env.REGISTRY }}/${{ env.IMAGE }} \
            -f dist/oci \
            --resolve-symlinks \
            --tag="${VERSION}" \
            --tag=latest \
            --annotation="org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation="org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation="org.opencontainers.image.version=${VERSION}" \
            2>&1 | grep "digest:" | awk '{print $2}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  sign-artifact:
    name: Sign Artifact (Cosign)
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Setup Cosign
        uses: sigstore/cosign-installer@main

      - name: Sign artifact
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}/welkin:${{ github.ref_name }} \
            --annotations "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --annotations "git-sha=${{ github.sha }}"