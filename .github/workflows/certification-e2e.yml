name: Certification E2E

on:
  workflow_dispatch:
    inputs:
      scenario_id:
        required: true
        description: 'Scenario to test (canonical-flow, plane-independence, etc.)'
        default: 'canonical-flow'
      timeout-minutes:
        required: false
        description: 'Total workflow timeout in minutes'
        default: '30'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/welkin
  # Synthetic certification credentials, isolated to CI Environment State.
  # They are only ever written into the ephemeral kind cluster as a Secret
  # for the duration of this run; they are not production defaults.
  OPENMETER_TOKEN: "test-token-${{ github.sha }}"
  ARCHIVE_S3_ACCESS_KEY_ID: "minio"
  ARCHIVE_S3_SECRET_ACCESS_KEY: "minio123"
  ARCHIVE_S3_BUCKET: "welkin-archive"
  ARCHIVE_S3_REGION: "us-east-1"
  ARCHIVE_S3_ENDPOINT: "http://minio.welkin-system.svc.cluster.local:9000"
  EVIDENCE_DIR: /tmp/welkin-evidence
  CLUSTER_NAME: welkin-e2e

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      DEPLOY_TIMEOUT: "360s"
      CERT_TIMEOUT: "600s"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Timoni
        run: go install github.com/stefanprodan/timoni/cmd/timoni@v0.31.0

      - name: Add Timoni to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | timoni registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build OCI artifact
        run: |
          VERSION="${GITHUB_SHA:0:8}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          timoni artifact build -f dist/oci -t "${VERSION}" -o "welkin-${VERSION}.oci.tar"

      - name: Create kind cluster
        run: kind create cluster --name "${{ env.CLUSTER_NAME }}"

      - name: Push OCI artifact once and capture immutable digest
        run: |
          DIGEST=$(timoni artifact push "oci://${{ env.REGISTRY }}/${{ env.IMAGE }}" \
            -f "welkin-${VERSION}.oci.tar" \
            --resolve-symlinks \
            --tag="${VERSION}" \
            --annotation="org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation="org.opencontainers.image.revision=${{ github.sha }}" \
            2>&1 | grep "digest:" | awk '{print $2}')
          echo "WELKIN_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "Pushed oci://${{ env.REGISTRY }}/${{ env.IMAGE }} digest=${DIGEST}"

      - name: Deploy Welkin via Timoni bundle apply
        run: |
          cat > /tmp/welkin.runtime.overlay.cue <<EOF
          package main

          runtime: {
            archive: {
              endpoint: "${ARCHIVE_S3_ENDPOINT}"
              bucket:   "${ARCHIVE_S3_BUCKET}"
            }
          }
          EOF
          timoni bundle apply \
            -f platform/bundles/welkin.bundle.cue \
            -f platform/runtime/welkin.runtime.cue \
            -f platform/collector/collector.cue \
            -f platform/economic/openmeter.cue \
            -f platform/economic/postgres.cue \
            -f platform/archive/minio.cue \
            -f /tmp/welkin.runtime.overlay.cue \
            --runtime-from-env \
            --wait=false

      - name: Wait for OpenMeter and collector pods
        run: |
          kubectl wait --namespace=welkin-system \
            --for=condition=ready pod \
            --timeout=${DEPLOY_TIMEOUT} \
            -l app.kubernetes.io/name=openmeter-api
          kubectl wait --namespace=welkin-system \
            --for=condition=ready pod \
            --timeout=${DEPLOY_TIMEOUT} \
            -l app.kubernetes.io/name=benthos-collector

      - name: Create certification secret (CI Environment State only)
        run: |
          kubectl create secret generic welkin-collector-secrets \
            --namespace=welkin-system \
            --from-literal=OPENMETER_TOKEN="${OPENMETER_TOKEN}" \
            --from-literal=ARCHIVE_S3_ACCESS_KEY_ID="${ARCHIVE_S3_ACCESS_KEY_ID}" \
            --from-literal=ARCHIVE_S3_SECRET_ACCESS_KEY="${ARCHIVE_S3_SECRET_ACCESS_KEY}"

      - name: Run certification Job
        run: |
          kubectl apply -f dist/flux/certification/certification-job.yaml
          kubectl wait --namespace=welkin-system \
            --for=condition=Complete \
            --timeout=${CERT_TIMEOUT} \
            job/welkin-certification

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p "${EVIDENCE_DIR}"
          STATUS=$(kubectl get job/welkin-certification -n welkin-system \
            -o jsonpath='{.status.succeeded}' 2>/dev/null || echo "0")
          if [ "$STATUS" = "1" ]; then
            echo "passed" > "${EVIDENCE_DIR}/certification-result.txt"
          else
            echo "failed" > "${EVIDENCE_DIR}/certification-result.txt"
          fi
          {
            echo "scenario_id=${{ inputs.scenario_id }}"
            echo "welkin_digest=${WELKIN_DIGEST:-unknown}"
            echo "cluster_name=${CLUSTER_NAME}"
            echo "job_succeeded=${STATUS}"
          } > "${EVIDENCE_DIR}/evidence.txt"
          kubectl logs job/welkin-certification -n welkin-system \
            > "${EVIDENCE_DIR}/certification-logs.txt" 2>&1 || true
          kubectl get all -n welkin-system \
            > "${EVIDENCE_DIR}/cluster-resources.txt" 2>&1 || true
          kubectl get helmreleases -n welkin-system \
            > "${EVIDENCE_DIR}/flux-helmreleases.txt" 2>&1 || true
          kubectl get events --namespace=welkin-system --sort-by=.metadata.creationTimestamp \
            > "${EVIDENCE_DIR}/events.txt" 2>&1 || true
          echo "welkin_digest=${WELKIN_DIGEST:-unknown}" \
            > "${EVIDENCE_DIR}/oci-digest.txt"

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: welkin-evidence-${{ github.sha }}-${{ inputs.scenario_id }}
          path: /tmp/welkin-evidence/**
          retention-days: 7
          if-no-files-found: warn

      - name: Destroy kind cluster
        if: always()
        run: kind delete cluster "${{ env.CLUSTER_NAME }}"

      - name: Verify cluster destroyed
        if: always()
        run: |
          if kind get clusters | grep -q "${{ env.CLUSTER_NAME }}"; then
            echo "WARNING: cluster still exists"
            kind get clusters
            exit 1
          fi
          echo "Cluster successfully destroyed"

      - name: Summarize E2E result
        if: always()
        run: |
          RESULT=$(cat "${EVIDENCE_DIR}/certification-result.txt" 2>/dev/null || echo "unknown")
          echo "=== E2E Certification Summary ==="
          echo "Scenario: ${{ inputs.scenario_id }}"
          echo "Result: ${RESULT}"
          echo "OCI Digest: ${WELKIN_DIGEST:-unknown}"
          echo "Cluster: destroyed"
          echo "Evidence: ${EVIDENCE_DIR}/"
