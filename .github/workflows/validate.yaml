name: validate

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Install Timoni
        run: go install github.com/stefanprodan/timoni/cmd/timoni@v0.31.0

      - name: Export certification catalog
        run: ~/go/bin/cue export cert/catalog.cue -e catalog > /tmp/welkin-certification-catalog.json

      - name: Validate certification catalog
        run: python cert/scripts/validate_catalog.py --catalog /tmp/welkin-certification-catalog.json

      - name: Compile certification scripts
        run: python3 -m py_compile cert/scripts/validate_catalog.py cert/scripts/render_evidence.py cert/scripts/run_scenario.py

      - name: Vet Timoni bundle
        run: ~/go/bin/timoni bundle vet -f platform/bundles/welkin.bundle.cue -f platform/runtime/welkin.runtime.cue -f platform/collector/collector.cue -f platform/economic/openmeter.cue -f platform/economic/postgres.cue -f platform/archive/minio.cue --runtime-from-env
        env:
          OPENMETER_TOKEN: ${{ secrets.OPENMETER_TOKEN }}
          ARCHIVE_S3_ENDPOINT: "http://minio:9000"
          ARCHIVE_S3_BUCKET: "welkin-archive"
          ARCHIVE_S3_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          ARCHIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
