name: validate

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CUE
        run: go install cuelang.org/go/cmd/cue@v0.4.0

      - name: Install Timoni
        run: go install github.com/stefanprodan/timoni/cmd/timoni@v0.30.0

      - name: Install rpk (test-only tooling)
        # rpk is used only as a local/CI test harness for Benthos/Redpanda Connect mappings
        # It is NOT the OpenMeter Collector runtime. Do not use rpk as a production collector.
        run: |
          curl -LO https://github.com/redpanda-data/redpanda/releases/download/v26.2.1/rpk-linux-amd64.zip
          unzip -o rpk-linux-amd64.zip -d /tmp/rpk
          sudo install /tmp/rpk/rpk /usr/local/bin/rpk

      - name: Export certification catalog
        run: ~/go/bin/cue export certification/catalog.cue -e catalog > /tmp/welkin-certification-catalog.json

      - name: Validate certification catalog
        run: python scripts/certification/validate_catalog.py --catalog /tmp/welkin-certification-catalog.json

      - name: Compile certification scripts
        run: python3 -m py_compile scripts/certification/validate_catalog.py scripts/certification/render_evidence.py scripts/certification/run_scenario.py
      - name: Validate canonical contract
        run: ~/go/bin/cue vet -d '#CloudEvent' ./engine/fixtures/canonical-event.json ./contracts/schema/cloudevent.cue

      - name: Prepare rpk-friendly collector config (test-only)
        run: |
          set -euo pipefail
          echo 'Backing up original engine/config/base.yaml'
          cp engine/config/base.yaml engine/config/base.yaml.bak || true
          python3 - <<'PY'
import yaml
p='engine/config/base.yaml'
with open(p) as f:
    doc=yaml.safe_load(f)
# Replace openmeter output resource with a file output for rpk tests
outs=doc.get('output_resources', [])
for i,item in enumerate(outs):
    if item.get('label')=='welkin_economic_openmeter':
        outs[i]={'label':'welkin_economic_openmeter','file':{'path':'/tmp/openmeter-test-output.json'}}
doc['output_resources']=outs
with open(p,'w') as f:
    yaml.safe_dump(doc,f)
print('Wrote test-friendly engine/config/base.yaml')
PY

      - name: Run collector tests
        run: rpk connect test ./engine/tests/*.yaml

      - name: Restore original collector config
        if: always()
        run: |
          set -euo pipefail
          if [ -f engine/config/base.yaml.bak ]; then
            mv engine/config/base.yaml.bak engine/config/base.yaml
          fi

      - name: Vet Timoni bundle
        run: ~/go/bin/timoni bundle vet -f timoni/bundles/welkin.bundle.cue -f timoni/runtime/welkin.runtime.cue
