name: certification-run

on:
  workflow_call:
    inputs:
      scenario_id:
        required: true
        type: string

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENMETER_TOKEN: "cert-test-token"
      ARCHIVE_S3_ACCESS_KEY_ID: "minio"
      ARCHIVE_S3_SECRET_ACCESS_KEY: "minio123"
      ARCHIVE_S3_BUCKET: "welkin-archive"
      ARCHIVE_S3_REGION: "us-east-1"
      ARCHIVE_S3_ENDPOINT: "http://minio.welkin-system.svc.cluster.local:9000"

    steps:
      - uses: actions/checkout@v4

      - name: Install Go tools
        run: |
          go install cuelang.org/go/cmd/cue@v0.17.1
          go install github.com/stefanprodan/timoni/cmd/timoni@v0.31.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install rpk
        run: |
          curl -LO https://github.com/redpanda-data/redpanda/releases/latest/download/rpk-linux-amd64.zip
          unzip rpk-linux-amd64.zip -d /tmp/rpk
          sudo mv /tmp/rpk/rpk /usr/local/bin/rpk
          rm -rf rpk-linux-amd64.zip /tmp/rpk

      - name: Export catalog
        run: |
          cue export -e 'catalog' cert/catalog.cue -o cert/catalog.json

      - name: Run certification scenario
        run: |
          mkdir -p artifacts
          python3 cert/scripts/run_scenario.py \
            --catalog cert/catalog.json \
            --scenario "cert/scenarios/${{ inputs.scenario_id }}.json" \
            --artifact-dir artifacts/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-${{ inputs.scenario_id }}
          path: artifacts/
          retention-days: 30
