apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: welkin-release
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 30s
  timeout: 5m0s
  path: ./
  prune: true
  wait: true
  targetNamespace: welkin-system
  sourceRef:
    kind: OCIRepository
    name: welkin-release
